name: onepace
on:
  schedule: [{cron: "32 2 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python check.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add seen.txt
          git diff --cached --quiet || (git commit -m update && git push)
